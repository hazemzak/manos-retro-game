<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Manos — Level 1</title>
<style>
  @font-face {
    font-family: 'ManosEnvironment';
    src: url('assets/fonts/ManosEnvironment.woff2') format('woff2'),
         url('assets/fonts/ManosEnvironment.ttf') format('truetype');
  }
  @font-face {
    font-family: 'ManosLyrics';
    src: url('assets/fonts/ManosLyrics.woff2') format('woff2'),
         url('assets/fonts/ManosLyrics.ttf') format('truetype');
  }
  html, body {
    margin: 0; padding: 0; background: #0a0e1a; overflow: hidden;
    height: 100%;
    /* iOS Safari rubber-band bounce isn't stopped by overflow:hidden alone --
       position:fixed on body is the documented fix (overscroll-behavior isn't
       supported by Safari for this). */
    position: fixed;
    width: 100%;
  }
  #game-container {
    width: 100vw;
    height: 100vh; /* fallback for browsers without svh support */
    /* 100vh on iOS Safari is computed against the LARGE viewport (toolbars
       retracted), which is taller than what's actually visible when the
       address bar is showing -- pushes/crops content out of the visible
       screen (phaserjs/phaser#6072). 100svh sizes against the small
       viewport (toolbars shown), matching what's actually on screen. */
    height: 100svh;
  }

  #volume-control {
    position: fixed;
    top: 12px;
    right: 16px;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: 'ManosLyrics', sans-serif;
    color: #f4e9d8;
    font-size: 14px;
    text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    user-select: none;
  }
  #volume-control input[type="range"] {
    width: 100px;
    accent-color: #b5473f;
  }

  /* Touch controls: shown only on touch-primary devices (real modern detection --
     NOT a viewport-width query, which would misfire on a narrow desktop window or a
     large tablet). */
  #touch-controls {
    display: none;
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 10;
    justify-content: space-between;
    align-items: flex-end;
    padding: 20px;
    /* Keep controls clear of the iPhone home-indicator bar (safe-area-inset-bottom
       is 0 on non-notch devices, so this is a no-op there). */
    padding-bottom: calc(20px + env(safe-area-inset-bottom));
    box-sizing: border-box;
    pointer-events: none;
    user-select: none;
  }
  @media (hover: none) and (pointer: coarse) {
    #touch-controls { display: flex; }
  }
  .touch-cluster {
    display: flex;
    gap: 14px;
    pointer-events: auto;
  }
  .touch-btn {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    border: 1px solid rgba(244,233,216,0.25);
    background: rgba(10,14,26,0.55);
    color: #f4e9d8;
    font-family: 'ManosLyrics', sans-serif;
    font-size: 26px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
  }
  .touch-btn:active { background: rgba(181,71,63,0.55); }
  .touch-btn-gesture { font-size: 22px; }

  /* GTA2-style "mission text" lyric bubble -- boxed, hard-edged (no border-radius, no
     blur/shadow softness -- that would read as modern UI, not 8-bit), dark solid
     background. Positioned via JS against the actual rendered canvas rect (see script
     below), not just page-relative CSS -- Phaser's Scale.FIT can letterbox, and a naive
     page-relative "top-center" can land in a letterbox bar rather than over the visible
     game on an unusual aspect ratio. Horizontal centering IS safe as plain CSS, since
     Scale.CENTER_BOTH means canvas-center and page-center already coincide. */
  #lyric-bubble {
    position: fixed;
    left: 50%;
    transform: translateX(-50%);
    bottom: 20px; /* overwritten by JS once the canvas rect is known */
    z-index: 10;
    max-width: min(80vw, 640px);
    box-sizing: border-box;
    padding: 10px 18px;
    background: #0a0e1a;
    border: 3px solid #f4e9d8;
    color: #f4e9d8;
    font-family: 'ManosLyrics', sans-serif;
    font-size: 18px;
    text-align: center;
    line-height: 1.4;
    /* Arabic lyric text -- must render right-to-left, the page itself is declared LTR/
       English (lang="en" on <html>), this is a deliberate scoped override. */
    direction: rtl;
    unicode-bidi: isolate;
    pointer-events: none; /* decorative overlay -- must never intercept the first tap/
                              click that unlocks audio, or any gameplay input */
    user-select: none;
    text-shadow: none; /* flat, no soft shadow -- reads as 8-bit, not modern UI */
  }
  #lyric-bubble[hidden] { display: none; }
  /* On touch devices #touch-controls occupies the bottom strip (64px buttons + 20px
     padding + safe-area) -- push the subtitle bubble up to clear it, rather than
     overlapping the gesture buttons. margin-bottom on a fixed+bottom-positioned element
     still pushes it further from the bottom edge (the JS-set `bottom` anchors the
     margin box), no extra JS needed for this. */
  @media (hover: none) and (pointer: coarse) {
    #lyric-bubble { margin-bottom: 92px; }
  }
</style>
</head>
<body>
<div id="game-container"></div>
<div id="volume-control">
  <span>♪</span>
  <input type="range" id="music-volume" min="0" max="1" step="0.05" value="0.5" />
</div>
<div id="touch-controls">
  <div class="touch-cluster">
    <button type="button" class="touch-btn" id="btn-left" aria-label="Left">◀</button>
    <button type="button" class="touch-btn" id="btn-jump" aria-label="Jump">▲</button>
    <button type="button" class="touch-btn" id="btn-right" aria-label="Right">▶</button>
  </div>
  <div class="touch-cluster">
    <button type="button" class="touch-btn touch-btn-gesture" id="btn-heart" aria-label="Give heart">♥</button>
    <button type="button" class="touch-btn touch-btn-gesture" id="btn-flowers" aria-label="Give flowers">✿</button>
    <button type="button" class="touch-btn touch-btn-gesture" id="btn-dizzy" aria-label="Dizzy">☺</button>
  </div>
</div>
<div id="lyric-bubble" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<script src="src/game.js"></script>
<script>
  document.getElementById('music-volume').addEventListener('input', (e) => {
    const scene = window.game && window.game.scene.keys.Level;
    if (scene && scene.music) scene.music.setVolume(parseFloat(e.target.value));
  });

  // Position the lyric bubble against the actual RENDERED canvas rect, not just a
  // fixed page offset -- Phaser.Scale.FIT can letterbox on unusual aspect ratios, and
  // a naive page-relative "bottom: 20px" can land in a letterbox bar below the visible
  // game instead of over it. Anchored from the canvas's BOTTOM edge (subtitle-style,
  // not the earlier top placement) -- distance-from-viewport-bottom, not top.
  function positionLyricBubble() {
    const canvas = window.game && window.game.canvas;
    const bubble = document.getElementById('lyric-bubble');
    if (!canvas || !bubble) return;
    const rect = canvas.getBoundingClientRect();
    bubble.style.bottom = (window.innerHeight - rect.bottom + 16) + 'px';
  }
  window.addEventListener('resize', positionLyricBubble);
  // The canvas doesn't exist until Phaser's Game boots -- poll briefly rather than
  // assuming a fixed ready time. Directly observed staleness bug, not theoretical: the
  // viewport's effective height can shift shortly after load (browser chrome/toolbar
  // settling) without firing a `resize` event synced to that layout change, leaving a
  // one-time-computed position stale (measured -54.75px off-screen in testing). A
  // cheap periodic re-check is more robust than trying to catch every possible cause --
  // mobile Safari's dynamic address-bar show/hide has the same class of risk.
  setInterval(() => { if (window.game && window.game.canvas) positionLyricBubble(); }, 500);
</script>
</body>
</html>
