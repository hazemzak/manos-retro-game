<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Manos — Level 1</title>
<!-- iOS has no in-tab Fullscreen API (verified current, Sept 2026 -- WebKit still doesn't
     implement requestFullscreen outside <video>) -- "Add to Home Screen" is the only real
     way to get a chrome-free iPhone experience, and these are the tags that actually make
     that launch fullscreen instead of as another Safari tab. Android Chrome gets the real
     Fullscreen API call instead (see the first-gesture handler in src/game.js). -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="mobile-web-app-capable" content="yes" />
<link rel="apple-touch-icon" href="assets/icons/icon-180.png" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="assets/icons/icon-512.png" />
<style>
  @font-face {
    font-family: 'ManosEnvironment';
    src: url('assets/fonts/ManosEnvironment.woff2') format('woff2'),
         url('assets/fonts/ManosEnvironment.ttf') format('truetype');
  }
  @font-face {
    font-family: 'ManosLyrics';
    src: url('assets/fonts/ManosLyrics.woff2') format('woff2'),
         url('assets/fonts/ManosLyrics.ttf') format('truetype');
  }
  html, body {
    margin: 0; padding: 0; background: #0a0e1a; overflow: hidden;
    height: 100%;
    /* iOS Safari rubber-band bounce isn't stopped by overflow:hidden alone --
       position:fixed on body is the documented fix (overscroll-behavior isn't
       supported by Safari for this). */
    position: fixed;
    width: 100%;
  }
  #game-container {
    width: 100vw;
    height: 100vh; /* fallback for browsers without svh support */
    /* 100vh on iOS Safari is computed against the LARGE viewport (toolbars
       retracted), which is taller than what's actually visible when the
       address bar is showing -- pushes/crops content out of the visible
       screen (phaserjs/phaser#6072). 100svh sizes against the small
       viewport (toolbars shown), matching what's actually on screen. */
    height: 100svh;
  }

  #volume-control {
    position: fixed;
    top: 12px;
    right: 16px;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: 'ManosLyrics', sans-serif;
    color: #f4e9d8;
    font-size: 14px;
    text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    user-select: none;
  }
  #volume-control input[type="range"] {
    width: 100px;
    accent-color: #b5473f;
  }

  /* Touch controls: shown only on touch-primary devices (real modern detection --
     NOT a viewport-width query, which would misfire on a narrow desktop window or a
     large tablet). */
  #touch-controls {
    display: none;
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 10;
    justify-content: space-between;
    align-items: flex-end;
    /* Keep controls clear of the iPhone home-indicator bar and, in landscape, the notch/
       rounded corners (every safe-area inset is 0 on non-notch devices, a no-op there). */
    padding: 20px calc(20px + env(safe-area-inset-right)) calc(20px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left));
    box-sizing: border-box;
    pointer-events: none;
    user-select: none;
  }
  @media (hover: none) and (pointer: coarse) {
    #touch-controls { display: flex; }
  }
  .touch-cluster {
    display: flex;
    gap: 14px;
    pointer-events: auto;
  }
  .touch-btn {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    border: 1px solid rgba(244,233,216,0.25);
    background: rgba(10,14,26,0.55);
    color: #f4e9d8;
    font-family: 'ManosLyrics', sans-serif;
    font-size: 26px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
    /* A held long-press on a button was popping iOS Safari's native text-selection
       callout ("Copy"/"Look Up") -- that menu is gated by -webkit-touch-callout
       specifically, not by user-select (which only stops text selection itself, a
       related but separate mechanism). Both set explicitly at the button level rather
       than relying on inheritance from #touch-controls. */
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
  }
  .touch-btn:active { background: rgba(181,71,63,0.55); }
  .touch-btn-gesture { font-size: 22px; }
  /* Narrow (phone portrait): one row of 3 + one row of 4 needs 558px, so both clusters fold
     to 2 columns -- jump centred above left/right, gestures 2x2 incl. Sing. 142px per
     cluster, 324px total with padding. Wide screens (landscape, tablets) keep the rows. */
  @media (max-width: 600px) {
    .touch-cluster { display: grid; grid-template-columns: repeat(2, 64px); }
    #btn-jump { grid-column: 1 / span 2; grid-row: 1; justify-self: center; }
    #btn-left { grid-column: 1; grid-row: 2; }
    #btn-right { grid-column: 2; grid-row: 2; }
  }

  /* GTA2-style "mission text" lyric bubble -- boxed, hard-edged (no border-radius, no
     blur/shadow softness -- that would read as modern UI, not 8-bit), dark solid
     background. Positioned via JS against the actual rendered canvas rect (see
     positionLyricBubble() below) at Hazem's calibrated coordinates (50.3%/86.3% of the
     rendered canvas rect) -- Phaser's Scale.FIT can letterbox, and a naive page-relative
     placement can land in a letterbox bar rather than over the visible game on an
     unusual aspect ratio. The left/top percentages below are only a pre-measurement
     fallback before JS runs; horizontal centering via transform stays plain CSS. */
  #lyric-bubble {
    position: fixed;
    left: 50.3%;
    top: 86.3%;
    bottom: auto;
    transform: translateX(-50%);
    margin: 0;
    z-index: 10;
    max-width: min(80vw, 640px);
    box-sizing: border-box;
    padding: 10px 18px;
    background: #0a0e1a;
    border: 3px solid #f4e9d8;
    color: #f4e9d8;
    font-family: 'ManosLyrics', sans-serif;
    font-size: 22px;
    text-align: center;
    line-height: 1.4;
    /* Arabic lyric text -- must render right-to-left, the page itself is declared LTR/
       English (lang="en" on <html>), this is a deliberate scoped override. */
    direction: rtl;
    unicode-bidi: isolate;
    pointer-events: none; /* decorative overlay -- must never intercept the first tap/
                              click that unlocks audio, or any gameplay input */
    user-select: none;
    text-shadow: none; /* flat, no soft shadow -- reads as 8-bit, not modern UI */
  }
  #lyric-bubble[hidden] { display: none; }

  /* GTA5-style phone-screen overlay -- slides in from the left during the 0:47 phone-call
     cutscene (see src/game.js's showPhonePanel()). Position now comes from JS (see
     positionPhoneOverlays() below), anchored against the real rendered canvas rect the
     same way #lyric-bubble is -- this game already hit the naive-page-relative-CSS bug
     once for that element. aspect-ratio reserves the panel's height before the stage
     image has finished loading (matches the 480x1101 source art). */
  #phone-panel {
    position: fixed;
    transform: translateX(calc(-100% - var(--phone-left, 300px) - 1px));
    transition: transform 0.4s ease-out;
    z-index: 11; /* above #lyric-bubble/touch-controls */
    pointer-events: none;
    aspect-ratio: 480 / 1101;
  }
  #phone-panel.phone-panel-visible {
    transform: translateX(0);
  }
  #phone-panel img { display: block; width: 100%; height: auto; }
  /* Sender + message text now live INSIDE the phone LCD as a CHILD of #phone-panel
     (position:absolute against the panel's own box), so they ride the panel's existing
     slide-in/out transform automatically -- no separate canvas-relative JS math needed.
     Percentages are the measured safe LCD content rectangle inside
     sms_stage_4_blank.png (480x1101 source): x=88,y=344,w=304,h=160. */
  #phone-message-text {
    position: absolute;
    left: 18.333333%;
    top: 31.244323%;
    width: 63.333333%;
    height: 14.532243%;
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    border: 0;
    background: transparent;
    color: #2b3521;
    font-family: 'ManosLyrics', sans-serif;
    font-size: var(--phone-message-size, 12px);
    line-height: 1.3;
    text-align: right;
    direction: rtl;
    unicode-bidi: isolate;
    overflow: hidden;
    pointer-events: none;
    user-select: none;
    text-shadow: none;
  }
  #phone-message-text[hidden] { display: none; }
  .phone-sender { font-size: 0.833333em; white-space: nowrap; }
  .phone-body { white-space: nowrap; }
  /* Verified live (foreman, claude-in-chrome, .foreman/scratch/rtl_bidi_test.html): a
     naive direction:rtl container mirrors "<3" into "3>" -- angle-bracket mirroring is a
     real Unicode Bidi property, not an image-export artifact, so this reproduces even in
     live DOM text, not just the baked sms_stage_4_opened.png image this whole DOM-overlay
     approach exists to avoid. Isolating just this token in an explicit LTR context is the
     fix -- confirmed rendering correctly (un-mirrored) in a real Chrome tab before being
     added here. */
  .ltr-iso { unicode-bidi: isolate; direction: ltr; display: inline-block; }

  /* World-anchored lyric boxes (#cinema-screen-lyrics, #heart-lyrics). Each box is laid out
     in 1280x720 DESIGN px (width/height/font-size set by fitWorldLyric() below) and moved
     onto the stage by one transform from positionWorldLyrics(): translate to the
     camera-projected screen point, scale by canvas scale x camera zoom, origin top-left. */
  #cinema-screen-lyrics, #heart-lyrics {
    left: 0;
    top: 0;
    transform-origin: 0 0;
  }
  /* In-world cinema-screen lyric overlay -- DOM text over the illuminated screen in the
     Level 2 Theatre, shown for real song lyrics during the song-clock 60s-134.38s window
     (see src/game.js's renderLyrics()). Upper placement is deliberate: it keeps clear of a
     jumping player (see plan geometry) without an occlusion mask. */
  #cinema-screen-lyrics {
    position: fixed;
    z-index: 9;
    display: flex;
    align-items: center;
    justify-content: center;
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    border: 0;
    background: transparent;
    /* Was #2b241b (dark brown), calibrated for the retired light cinema-hall screen.
       The Level 2 Theatre background this now overlays is dark throughout (measured
       mean luminance 78-106 across every candidate placement) -- a dark-brown fill has
       no usable contrast anywhere on it. Light cream reads clearly against the dark
       stage/curtain art instead. */
    color: #f5e6c8;
    font-family: 'ManosLyrics', sans-serif;
    font-size: 22px;
    line-height: 1.25;
    text-align: center;
    direction: rtl;
    unicode-bidi: isolate;
    white-space: normal;
    overflow-wrap: normal;
    overflow: hidden;
    pointer-events: none;
    user-select: none;
    text-shadow: none;
  }
  #cinema-screen-lyrics[hidden] { display: none; }
  /* Level 1 lyrics inside the lit heart marquee of the Fara7 background (replaces
     #lyric-bubble in Fara7 only). Warm yellow #FFD54A on the heart's dark red (~#5a0a0a) is
     ~10:1 contrast. Same flat 8-bit treatment as the cinema screen: no shadow, no box. */
  #heart-lyrics {
    position: fixed;
    z-index: 9;
    display: flex;
    align-items: center;
    justify-content: center;
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    border: 0;
    background: transparent;
    color: #FFD54A;
    font-family: 'ManosLyrics', sans-serif;
    font-size: 28px;
    line-height: 1.2;
    text-align: center;
    direction: rtl;
    unicode-bidi: isolate;
    white-space: nowrap; /* one line: fitWorldLyric() shrinks 28->22 instead of wrapping */
    overflow-wrap: normal;
    overflow: hidden;
    pointer-events: none;
    user-select: none;
    text-shadow: none;
  }
  #heart-lyrics[hidden] { display: none; }

  /* Inert credits-scroll overlay -- hidden by default, positioned via JS to cover the
     rendered canvas area under Scale.FIT letterboxing. Styled as a fixed overlay matching
     the existing convention for #lyric-bubble and #cinema-screen-lyrics. Reveal and scroll
     logic is handled by src/game.js (not this markup file). */
  #credits-overlay {
    position: fixed;
    z-index: 12; /* above #phone-panel (11) and touch-controls/lyric-bubble (10) */
    box-sizing: border-box;
    margin: 0;
    padding: 20px;
    background: #0a0e1a;
    overflow: hidden;
    pointer-events: none;
    user-select: none;
  }
  #credits-overlay[hidden] { display: none; }
  #credits-content {
    color: #f4e9d8;
    font-family: 'ManosLyrics', sans-serif;
    font-size: 18px;
    text-align: center;
    line-height: 1.4;
  }
</style>
</head>
<body>
<div id="game-container"></div>
<div id="volume-control">
  <span>♪</span>
  <input type="range" id="music-volume" min="0" max="1" step="0.05" value="0.5" />
</div>
<div id="touch-controls">
  <div class="touch-cluster">
    <button type="button" class="touch-btn" id="btn-left" aria-label="Left">◀</button>
    <button type="button" class="touch-btn" id="btn-jump" aria-label="Jump">▲</button>
    <button type="button" class="touch-btn" id="btn-right" aria-label="Right">▶</button>
  </div>
  <div class="touch-cluster">
    <button type="button" class="touch-btn touch-btn-gesture" id="btn-heart" aria-label="Give heart">♥</button>
    <button type="button" class="touch-btn touch-btn-gesture" id="btn-flowers" aria-label="Give flowers">✿</button>
    <button type="button" class="touch-btn touch-btn-gesture" id="btn-dizzy" aria-label="Dizzy">☺</button>
    <button type="button" class="touch-btn touch-btn-gesture" id="btn-sing" aria-label="Sing">🎤</button>
  </div>
</div>
<div id="lyric-bubble" hidden></div>
<div id="cinema-screen-lyrics" lang="ar" dir="rtl" hidden></div>
<div id="heart-lyrics" lang="ar" dir="rtl" hidden></div>
<div id="phone-panel">
  <img id="phone-screen-img" src="" alt="" />
  <div id="phone-message-text" lang="ar" dir="rtl" hidden>
    <div class="phone-sender">♥ من مانوس</div>
    <div class="phone-body"><span class="ltr-iso">&lt;3</span> : يلا عالمسرح</div>
  </div>
</div>
<div id="credits-overlay" hidden>
  <div id="credits-content">[CREDITS PLACEHOLDER -- Hazem to provide]</div>
</div>
<!-- Phaser is vendored so the game runs with no network: sandboxed agents could not verify
     anything while this was CDN-only (ERR_NETWORK_ACCESS_DENIED). CDN stays as the fallback. -->
<script src="vendor/phaser-3.80.1.min.js"></script>
<script>
  if (!window.Phaser) {
    document.write('<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"><\/script>');
  }
</script>
<script src="src/game.js"></script>
<script>
  document.getElementById('music-volume').addEventListener('input', (e) => {
    const scene = window.game && window.game.scene.keys.Level;
    if (scene && scene.music) scene.music.setVolume(parseFloat(e.target.value));
  });

  // Position the lyric bubble against the actual RENDERED canvas rect, not just a
  // fixed page offset -- Phaser.Scale.FIT can letterbox on unusual aspect ratios, and
  // a naive page-relative placement can land in a letterbox bar rather than over the
  // visible game. Hazem's calibrated position: 50.3% across / 86.3% down the rendered
  // canvas rect, held constant for the whole song (visibility is controlled separately
  // by src/game.js's renderLyrics()).
  const LYRIC_BUBBLE_RECT = { centerXPct: 0.503, topPct: 0.863 };
  function positionLyricBubble() {
    const canvas = window.game && window.game.canvas;
    const bubble = document.getElementById('lyric-bubble');
    if (!canvas || !bubble) return;
    const rect = canvas.getBoundingClientRect();
    bubble.style.left = (rect.left + LYRIC_BUBBLE_RECT.centerXPct * rect.width) + 'px';
    bubble.style.top = (rect.top + LYRIC_BUBBLE_RECT.topPct * rect.height) + 'px';
    bubble.style.bottom = 'auto';
  }
  // Phone-panel placement, calibrated against the design canvas (1376x768) and
  // converted against the real rendered canvas rect -- same reasoning as
  // positionLyricBubble() above (Phaser.Scale.FIT letterboxing), but top/left-anchored
  // rather than bottom-anchored, so no extra viewport-height math is needed here.
  // #phone-message-text is now a CHILD of #phone-panel (percentage-positioned against
  // the panel's own box in CSS) so it rides the panel's slide transform automatically --
  // the only thing it still needs from here is its font size, which must scale WITH the
  // phone (unlike the lyric bubble) to stay physically inside the drawn LCD.
  const PHONE_PANEL_RECT = { leftPct: 0.085, topPct: 0.629, widthPct: 0.102 };

  function positionPhoneOverlays() {
    const canvas = window.game && window.game.canvas;
    if (!canvas) return;
    const rect = canvas.getBoundingClientRect();
    const panel = document.getElementById('phone-panel');
    if (panel) {
      const leftPx = rect.left + PHONE_PANEL_RECT.leftPct * rect.width;
      panel.style.left = leftPx + 'px';
      panel.style.top = (rect.top + PHONE_PANEL_RECT.topPct * rect.height) + 'px';
      panel.style.width = (PHONE_PANEL_RECT.widthPct * rect.width) + 'px';
      // CODEX FIX (Item 3, #1): expose the resting `left` as a custom property so the CSS
      // hidden-state transform (below) can compute an offset that's always far enough past the
      // TRUE page edge, regardless of what this JS-computed `left` actually resolves to -- a
      // fixed percentage like translateX(-105%) is relative to the element's OWN width, not to
      // how far `left` already sits from the real edge, and can leave it only partially hidden.
      panel.style.setProperty('--phone-left', leftPx + 'px');
      // Native design size is 12px (body) / 10px (sender, via the .phone-sender 0.833em
      // rule) at the 1376px-wide design canvas -- scale with the actual rendered width.
      panel.style.setProperty('--phone-message-size', (12 * rect.width / 1376) + 'px');
    }
  }

  // In-world cinema-screen lyric box, in 1280x720 design px. This is the stage backdrop
  // between the curtain legs, above the sopranos' heads (their content tops sit at y=328)
  // and below the valance's lowest dip (~y=248) -- the only clear, unoccupied space there.
  // INTERIM (2026-09-10): the old 1376x768 rect (520, 252, 340x58) converted proportionally
  // to the 1280x720 canvas; not yet re-measured against the new theatre plate (Q3 validates).
  const CINEMA_LYRIC_RECT = { x: 483.7, y: 236.3, width: 316.3, height: 54.4 };
  // Level 1 one-line lyric box inside the Fara7 heart marquee's dark interior, in 1280x720
  // design px. Measured 2026-09-13, fara7_geometry report (section 5): inside the all-8-frame
  // safe interior mask (>4px from bulb glow, below the notch, above the flowers), #FFD54A
  // contrast >= 10.71:1 at the worst pixel.
  const HEART_LYRIC_RECT = { x: 514, y: 212, width: 248, height: 42 };
  // Font ranges in design px (shrink-to-fit, 1px steps). Cinema: 22->17 as before. Heart:
  // 28->22 on ONE line (CSS nowrap, so it shrinks instead of wrapping): the longest Level 1
  // cue is ~231px wide at 28 and the 1.44em ink height fits 42; 22 design px is still ~12 CSS
  // px on a 400px-tall landscape phone (same report).
  const WORLD_LYRICS = [
    { id: 'cinema-screen-lyrics', rect: CINEMA_LYRIC_RECT, maxFont: 22, minFont: 17 },
    { id: 'heart-lyrics', rect: HEART_LYRIC_RECT, maxFont: 28, minFont: 22 },
  ];

  // Cached rendered canvas rect: refreshed only by positionAllOverlays() (resize,
  // visualViewport, Phaser's own scale resize, font load, the 500ms fallback), never read per frame.
  let canvasRect = null;
  function refreshCanvasRect() {
    const canvas = window.game && window.game.canvas;
    canvasRect = canvas ? canvas.getBoundingClientRect() : null;
  }
  // Bumped when a font finishes loading, so every box re-fits once with real metrics.
  let fontGeneration = 0;
  const fittedKeys = new WeakMap();

  // FITTING (layout reads): only when the text or the loaded font changed, or on the first
  // visible layout (hidden boxes are skipped by the caller, so they fit once shown). The box is
  // design px, so the result is independent of viewport size and camera zoom.
  function fitWorldLyric(el, box) {
    const key = fontGeneration + '|' + el.textContent;
    if (fittedKeys.get(el) === key) return;
    el.style.width = box.rect.width + 'px';
    el.style.height = box.rect.height + 'px';
    let size = box.maxFont;
    el.style.fontSize = size + 'px';
    while (size > box.minFont
      && (el.scrollWidth > el.clientWidth + 1 || el.scrollHeight > el.clientHeight + 1)) {
      size -= 1;
      el.style.fontSize = size + 'px';
    }
    fittedKeys.set(el, key);
  }

  // World rect -> screen placement, from the camera transform Phaser just rendered with:
  // camera.matrix maps (world - scroll) to canvas px (for this unrotated camera that is
  // floor(cam.x + ox) + zoom * (world - scroll - ox)); the cached canvas rect maps canvas px
  // to CSS px. Returns null until the game and its camera exist.
  function worldLyricScreenBox(rect) {
    const scene = window.game && window.game.scene.keys.Level;
    const cam = scene && scene.cameras && scene.cameras.main;
    if (!canvasRect) refreshCanvasRect();
    if (!cam || !canvasRect) return null;
    const m = cam.matrix;
    const p = m.transformPoint(rect.x - cam.scrollX, rect.y - cam.scrollY);
    const sx = canvasRect.width / 1280;
    const sy = canvasRect.height / 720;
    return {
      left: canvasRect.left + sx * p.x,
      top: canvasRect.top + sy * p.y,
      width: sx * m.a * rect.width,
      height: sy * m.d * rect.height,
      scaleX: sx * m.a,
      scaleY: sy * m.d,
    };
  }

  // POSITIONING (no layout reads): called after every render by src/game.js's post-render
  // hook and by positionAllOverlays() -- one helper, so the fallback can never disagree with
  // or overwrite the camera-driven placement.
  function positionWorldLyrics() {
    for (const box of WORLD_LYRICS) {
      const el = document.getElementById(box.id);
      if (!el || el.hidden || !el.textContent) continue;
      fitWorldLyric(el, box);
      const s = worldLyricScreenBox(box.rect);
      if (!s) continue;
      const transform = `translate(${s.left}px, ${s.top}px) scale(${s.scaleX}, ${s.scaleY})`;
      if (box.lastTransform !== transform) {
        el.style.transform = transform;
        box.lastTransform = transform;
      }
    }
  }
  window.positionWorldLyrics = positionWorldLyrics;

  // Credits overlay positioning hook -- keeps the overlay aligned to the rendered canvas
  // area under Scale.FIT letterboxing, following the same pattern as the existing overlays.
  // Covers the entire canvas rect so that later reveal/scroll logic (in src/game.js) can
  // scroll content within it.
  function positionCreditsOverlay() {
    const canvas = window.game && window.game.canvas;
    const overlay = document.getElementById('credits-overlay');
    if (!canvas || !overlay) return;
    const rect = canvas.getBoundingClientRect();
    overlay.style.left = rect.left + 'px';
    overlay.style.top = rect.top + 'px';
    overlay.style.width = rect.width + 'px';
    overlay.style.height = rect.height + 'px';
  }
  // Exposed so src/game.js can call this directly when needed.
  window.positionCreditsOverlay = positionCreditsOverlay;

  function positionAllOverlays() {
    refreshCanvasRect();
    positionLyricBubble();
    positionPhoneOverlays();
    positionWorldLyrics();
    positionCreditsOverlay();
  }

  window.addEventListener('resize', positionAllOverlays);
  // Phaser's Scale.FIT applies a window resize on its NEXT game step, after the listener
  // above has already run -- its own resize event is when the canvas rect is actually new.
  if (window.game && window.game.scale) window.game.scale.on('resize', positionAllOverlays);
  // visualViewport's own events are used only as a WHEN-to-recheck trigger here -- it
  // fires more promptly than window's resize for some mobile toolbar-driven viewport
  // changes.
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', positionAllOverlays);
    window.visualViewport.addEventListener('scroll', positionAllOverlays);
  }
  // Cheap fallback net: the canvas doesn't exist until Phaser's Game boots, and this
  // also catches the rare case of no visualViewport support at all.
  setInterval(() => { if (window.game && window.game.canvas) { positionAllOverlays(); } }, 500);
  // Custom font metrics (ManosLyrics) change text layout once the font actually loads --
  // re-run everything once it's ready rather than waiting on the 500ms fallback.
  // fontGeneration forces one re-fit of the world lyric boxes with the real metrics.
  const onFontsLoaded = () => { fontGeneration += 1; positionAllOverlays(); };
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(onFontsLoaded);
    document.fonts.addEventListener('loadingdone', onFontsLoaded);
  }
  // A phone stage-image swap (see showPhonePanel() in src/game.js) doesn't change any
  // measurement made here, but re-running immediately on load avoids a visible
  // stale-position frame between the swap and the next 500ms fallback tick.
  const phoneScreenImg = document.getElementById('phone-screen-img');
  if (phoneScreenImg) {
    phoneScreenImg.addEventListener('load', positionAllOverlays);
  }
</script>
</body>
</html>
